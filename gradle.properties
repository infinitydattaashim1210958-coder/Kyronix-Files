# Project-wide Gradle settings

# JVM memory — increase if you hit OOM during dexing on large projects
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX — required; without this the Support Library and AndroidX can clash
android.useAndroidX=true

# Jetifier — converts legacy Support Library deps to AndroidX automatically
android.enableJetifier=true

# Kotlin version — consumed by build.gradle via $kotlin_version
kotlin.version=2.0.21

# Enable Gradle configuration cache for faster incremental builds
org.gradle.configuration-cache=true

# Parallel builds
org.gradle.parallel=true
