#
# gradle-wrapper.properties
#
# Gradle 8.9 is required for AGP 8.7.1 + Kotlin 2.0.21.
# GitHub Actions downloads this automatically — no local install needed.
#
# Compatibility matrix kept here for reference:
#   AGP 8.7.x  → Gradle 8.9+
#   Kotlin 2.0 → Gradle 7.6+  (8.9 is fine)
#   JDK 17     → required minimum for AGP 8.x
#
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
