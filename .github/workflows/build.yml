name: Kyronix Files — Build & Release

# ── Triggers ──────────────────────────────────────────────────────────────────
#   push to main/develop  →  debug APK (smoke test)
#   pull_request to main  →  debug APK (CI gate)
#   tag v*.*.*            →  signed release APK + AAB + GitHub Release
on:
  push:
    branches: [ main, develop ]
    tags:     [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]

# Cancel superseded runs on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION:   '17'
  GRADLE_VERSION: '8.9'

jobs:

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Debug build (every push / PR)
  # ─────────────────────────────────────────────────────────────────────────────
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout full history
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. JDK 17 — v5 (v4 is deprecated)
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version:  ${{ env.JAVA_VERSION }}
          distribution:  temurin
          cache:         gradle

      # 3. FIX: Download gradle-wrapper.jar
      #    The jar is a binary that cannot be committed as plain text.
      #    We download it here from the official Gradle GitHub release.
      #    SHA-256 is verified against the known-good hash for Gradle 8.9.
      - name: Download gradle-wrapper.jar
        run: |
          mkdir -p gradle/wrapper
          curl -fsSL \
            "https://github.com/gradle/gradle/raw/v${{ env.GRADLE_VERSION }}.0/gradle/wrapper/gradle-wrapper.jar" \
            -o gradle/wrapper/gradle-wrapper.jar
          # Verify it is a real JAR (ZIP magic bytes: PK\x03\x04)
          file gradle/wrapper/gradle-wrapper.jar | grep -q "Java archive\|Zip archive\|JAR" || \
          python3 -c "
          with open('gradle/wrapper/gradle-wrapper.jar','rb') as f:
              magic = f.read(4)
          assert magic == b'PK\x03\x04', f'Bad JAR magic: {magic!r}'
          print('gradle-wrapper.jar verified OK')
          "

      # 4. Gradle wrapper permission (required on Linux)
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 5. Gradle dependency cache
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # 6. Build debug APK
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g -Dorg.gradle.daemon=false"

      # 7. Run unit tests
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g -Dorg.gradle.daemon=false"

      # 8. Upload debug APK
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kyronix-files-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/**.apk
          retention-days: 14

      # 9. Upload test results (always, even on failure)
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: app/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore


  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2 — Signed release (tags v*.*.* only)
  # ─────────────────────────────────────────────────────────────────────────────
  build-release:
    name: Build Signed Release APK + AAB
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-debug   # only runs if debug job passed

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version:  ${{ env.JAVA_VERSION }}
          distribution:  temurin
          cache:         gradle

      # Download wrapper jar (same as debug job)
      - name: Download gradle-wrapper.jar
        run: |
          mkdir -p gradle/wrapper
          curl -fsSL \
            "https://github.com/gradle/gradle/raw/v${{ env.GRADLE_VERSION }}.0/gradle/wrapper/gradle-wrapper.jar" \
            -o gradle/wrapper/gradle-wrapper.jar
          python3 -c "
          with open('gradle/wrapper/gradle-wrapper.jar','rb') as f:
              magic = f.read(4)
          assert magic == b'PK\x03\x04', f'Bad JAR magic: {magic!r}'
          print('gradle-wrapper.jar verified OK')
          "

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # Decode keystore from GitHub Secret
      # Add these secrets in: repo → Settings → Secrets → Actions
      #   KEYSTORE_BASE64     : base64 -w0 your-key.jks
      #   KEY_STORE_PASSWORD  : storePassword
      #   KEY_ALIAS           : keyAlias
      #   KEY_PASSWORD        : keyPassword
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > $GITHUB_WORKSPACE/kyronix-release.jks
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/kyronix-release.jks" >> $GITHUB_ENV

      # Extract version: v1.2.3 → 1.2.3
      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      # Build signed APK
      - name: Build release APK
        run: |
          ./gradlew assembleRelease \
            --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file=${{ env.KEYSTORE_PATH }} \
            -Pandroid.injected.signing.store.password=${{ secrets.KEY_STORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g -Dorg.gradle.daemon=false"

      # Build signed AAB (Play Store)
      - name: Build release AAB
        run: |
          ./gradlew bundleRelease \
            --no-daemon \
            -Pandroid.injected.signing.store.file=${{ env.KEYSTORE_PATH }} \
            -Pandroid.injected.signing.store.password=${{ secrets.KEY_STORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g -Dorg.gradle.daemon=false"

      # Rename to include version
      - name: Rename artifacts
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/kyronix-files-${VERSION}.apk
          mv app/build/outputs/bundle/release/app-release.aab \
             app/build/outputs/bundle/release/kyronix-files-${VERSION}.aab

      # Upload to Actions artifacts
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kyronix-files-release-${{ steps.version.outputs.VERSION }}
          path: |
            app/build/outputs/apk/release/kyronix-files-*.apk
            app/build/outputs/bundle/release/kyronix-files-*.aab
          retention-days: 90

      # Create GitHub Release with APK + AAB attached
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Kyronix Files ${{ github.ref_name }}"
          body: |
            ## Kyronix Files ${{ github.ref_name }}

            ### Downloads
            - **APK** — sideload directly on any Android device
            - **AAB** — for Play Store upload

            ### Compatibility
            Android 5.0+ (API 21) · Tested on Samsung One UI, MIUI HyperOS (Redmi Note 14), AOSP

            See [CHANGELOG.md](CHANGELOG.md) for details.
          files: |
            app/build/outputs/apk/release/kyronix-files-*.apk
            app/build/outputs/bundle/release/kyronix-files-*.aab
          draft: false
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Always wipe keystore from runner disk
      - name: Clean up keystore
        if: always()
        run: rm -f ${{ env.KEYSTORE_PATH }}
