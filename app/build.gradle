plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.kyronix.files'
    compileSdk 35   // Android 15

    defaultConfig {
        applicationId "com.kyronix.files"
        // minSdk 21 = Android 5.0 Lollipop — covers 99 %+ of active devices
        // including Redmi Note 14 (ships Android 14 / HyperOS 2)
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        // Enable K2 compiler (stable in Kotlin 2.x); remove if using Kotlin < 2.0
        // languageVersion = '2.0'
    }

    // Source sets: Kotlin lives under src/main/kotlin/
    sourceSets {
        main {
            java.srcDirs = ['src/main/kotlin']
        }
    }

    buildFeatures {
        buildConfig true   // exposes BuildConfig.APPLICATION_ID at runtime
        viewBinding false  // not used — keeping view lookups explicit for clarity
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    // ── Kotlin stdlib + coroutines ──────────────────────────────────────────
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"

    // ── AndroidX core ───────────────────────────────────────────────────────
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'

    // ── RecyclerView + SwipeRefresh ─────────────────────────────────────────
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // ── Material 3 (includes BottomNavigationView, ChipGroup, Snackbar) ─────
    implementation 'com.google.android.material:material:1.12.0'

    // ── CoordinatorLayout (for app-bar scroll behaviour) ────────────────────
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'

    // ── FileProvider (part of core, but explicit for clarity) ───────────────
    // Already bundled via core-ktx; no separate dep needed.

    // ── Testing ─────────────────────────────────────────────────────────────
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
